<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>Listado de productos</title>
</head>

<body>

    <!-- Añade fragmento: ~{...} -->
    <div th:replace="~{fragments/layout :: cabecera}"></div>

    <span class="alert alert-warning" th:if="${productos.empty}">
        Esto está vacío
    </span>

    <div th:unless="${productos.empty}">
        <table class="table">
            <!-- Page<Producto> => iterar por productos.content -->
            <tr th:each="producto : ${productos.content}">
                <td><span th:text="${producto.nombre}"></span></td>
                <td><span th:text="${producto.precio}"></span></td>
                <td><span th:text="${producto.categoria}"></span></td>

                <td>
                    <a th:href="@{/productos/{id}(id=${producto.id})}">Ver detalle</a>
                </td>

                <td>
                    <a th:href="@{/productos/{id}/editar(id=${producto.id})}">Editar</a>
                </td>

                <td>
                    <a th:href="@{/productos/{id}/eliminar(id=${producto.id})}">Eliminar</a>
                </td>
            </tr>
        </table>

		<!-- Añade fragmento: ~{...} -->
        <div th:replace="~{fragments/layout :: paginacion}"></div>
    </div>

    <a th:href="@{/formulario}">Agregar Producto</a>

    <!-- Añade fragmento: ~{...} -->
    <div th:replace="~{fragments/layout :: pie}"></div>

</body>
</html>
