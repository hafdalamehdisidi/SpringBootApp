<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Conversor de temperatura</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="fragments/layout :: cabecera"></div>

<div class="container">
    <h1>Conversor de temperatura</h1>

    <form th:object="${conversion}" th:action="@{/conversor}" th:method="post" style="max-width: 24rem;">

        <div class="mb-3">
            <label class="form-label">Temperatura</label>
            <input type="number" step="0.01" class="form-control" th:field="*{valor}" />
        </div>

        <div class="mb-3">
            <label class="form-label">Tipo de conversión</label>
            <select class="form-select" th:field="*{tipoConversion}">
                <option value="CtoF">Celsius a Fahrenheit</option>
                <option value="FtoC">Fahrenheit a Celsius</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Convertir</button>
    </form>

    <div class="alert alert-success mt-3" th:if="${conversion.resultado != null}">
        Resultado: <span th:text="${conversion.resultado}"></span>
    </div>
</div>

<div th:replace="fragments/layout :: pie"></div>
</body>
</html>
