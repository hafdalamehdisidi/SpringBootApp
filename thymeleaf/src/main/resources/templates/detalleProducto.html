<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle del producto</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<h1>Detalle del producto</h1>

<div th:if="${producto != null}" class="card" style="max-width: 24rem;">
    <div class="card-body">
        <h5 class="card-title" th:text="${producto.nombre}">Nombre (prototipo)</h5>
        <p class="card-text">Precio: <span th:text="${producto.precio}">0.00</span></p>
        <p class="card-text">Categoría: <span th:text="${producto.categoria}">Categoría (prototipo)</span></p>
    </div>
</div>

<div th:if="${producto == null}" class="alert alert-warning">
    Producto no encontrado.
</div>

<a class="btn btn-secondary mt-3" th:href="@{/productos}">Volver al listado</a>
</body>
</html>
