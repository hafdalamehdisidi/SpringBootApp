<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cálculo de gastos de envío</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="fragments/layout :: cabecera"></div>

<div class="container">
    <h1>Gastos de envío</h1>

    <form th:object="${envio}" th:action="@{/envio/calcular}" th:method="post" style="max-width: 24rem;">

        <div class="mb-3">
            <label class="form-label">Peso (kg)</label>
            <input type="number" step="0.01" class="form-control" th:field="*{peso}" />
        </div>

        <div class="mb-3">
            <label class="form-label">Destino</label>
            <select class="form-select" th:field="*{destino}">
                <option value="nacional">Nacional</option>
                <option value="europa">Europa</option>
                <option value="internacional">Internacional</option>
            </select>
        </div>

        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" th:field="*{urgente}" />
            <label class="form-check-label">Envío urgente</label>
        </div>

        <button type="submit" class="btn btn-primary">Calcular</button>
    </form>

    <div class="card mt-3" style="max-width: 24rem;" th:if="${envio.total != null}">
        <div class="card-body">
            <h5 class="card-title">Resumen del envío</h5>
            <ul class="list-unstyled">
                <li>Coste base (<span th:text="${envio.destino}"></span>): <span th:text="${envio.costeBase}"></span> €</li>
                <li>Recargo por peso: <span th:text="${envio.recargoPeso}"></span> €</li>
                <li>Recargo por urgencia: <span th:text="${envio.recargoUrgente}"></span> €</li>
            </ul>
            <p class="fw-bold">Total: <span th:text="${envio.total}"></span> €</p>
        </div>
    </div>
</div>

<div th:replace="fragments/layout :: pie"></div>
</body>
</html>
