<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo producto</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<h1>Nuevo producto</h1>

<form th:object="${producto}" th:action="@{/productos/nuevo}" method="post" style="max-width: 24rem;">

    <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" class="form-control" th:field="*{nombre}" />
    </div>

    <div class="mb-3">
        <label class="form-label">Precio</label>
        <input type="number" step="0.01" class="form-control" th:field="*{precio}" />
    </div>

    <div class="mb-3">
        <label class="form-label">Categoría</label>
        <input type="text" class="form-control" th:field="*{categoria}" />
    </div>

    <button type="submit" class="btn btn-primary">Guardar</button>
    <a class="btn btn-secondary" th:href="@{/productos}">Cancelar</a>
</form>
</body>
</html>
