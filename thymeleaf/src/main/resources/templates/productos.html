<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de productos</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="fragments/layout :: cabecera"></div>

<div class="container">
    <h1>Productos</h1>

    <a class="btn btn-success mb-3" th:href="@{/productos/nuevo}">Nuevo producto</a>

    <form th:action="@{/productos/buscar}" th:method="get" class="row g-2 mb-3">
        <div class="col-auto">
            <input type="text" name="query" class="form-control" placeholder="Buscar por nombre"
                   th:value="${query}" />
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Buscar</button>
        </div>
    </form>

    <div class="alert alert-warning" th:if="${listaProductos.size() == 0}">
        <span th:if="${query != null}">No se encontraron productos para "<span th:text="${query}"></span>".</span>
        <span th:if="${query == null}">No hay productos disponibles.</span>
    </div>

    <div th:unless="${listaProductos.isEmpty()}">
        <table class="table table-striped table-bordered">
            <thead>
            <tr>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Categoría</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="producto : ${listaProductos}">
                <td th:text="${producto.nombre}">Nombre (prototipo)</td>
                <td th:text="${producto.precio}">Precio (prototipo)</td>
                <td th:text="${producto.categoria}">Categoría (prototipo)</td>
                <td>
                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{/productos/{id}(id=${producto.id})}">Ver detalle</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="fragments/layout :: pie"></div>
</body>
</html>
