<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de productos</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<h1>Productos</h1>

<div class="alert alert-warning" th:if="${listaProductos.size() == 0}">
    No hay productos disponibles.
</div>

<div th:unless="${listaProductos.isEmpty()}">
    <table class="table table-striped table-bordered">
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Categoría</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="producto : ${listaProductos}">
            <td th:text="${producto.nombre}">Nombre (prototipo)</td>
            <td th:text="${producto.precio}">Precio (prototipo)</td>
            <td th:text="${producto.categoria}">Categoría (prototipo)</td>
            <td>
                <a class="btn btn-sm btn-outline-primary"
                   th:href="@{/productos/{id}(id=${producto.id})}">Ver detalle</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
